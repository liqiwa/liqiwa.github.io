# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# 强制使用UTF-8编码
encoding: utf-8

title: Liqiwa.com
email:
description: 一个数据库与技术支持从业者的真实实验记录：AI工具、OpenClaw、数据库学习、小产品和内容验证。
url: "https://liqiwa.com"
baseurl: ""
locale: "zh-CN"
twitter_username: liqiwa
github_username: liqiwa
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Asia/Shanghai
future: false
include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - README.md
  - OPTIMIZATION_PLAN.md
  - OPTIMIZATION_SUMMARY.md
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "力奇蛙"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "数据库与技术支持从业者。记录AI实践、OpenClaw排障、数据库学习和小产品实验。"
  links:
    - label: "微信公众号"
      icon: "fab fa-fw fa-weixin"
      url: "/about/#wechat"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/liqiwa"


footer:
  links:
    - label: "隐私政策"
      icon: "fas fa-fw fa-shield-alt"
      url: "/privacy/"
    - label: "微信公众号"
      icon: "fab fa-fw fa-weixin"
      url: "/about/#wechat"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/liqiwa"


defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-5JC1HXBSX8"
    measurement_id: "G-5JC1HXBSX8"
    anonymize_ip: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
